[project]
name = "scra"
version = "0.8.0"
description = "Secure Code Review Agent for JavaScript/Node web apps"
requires-python = ">=3.10"
dependencies = [
  "pydantic>=2.6",
  "requests>=2.31",
  "scikit-learn>=1.3",
  "semgrep>=1.60",
  "gradio>=6,<7",
  "opentelemetry-api~=1.37.0",  # see requirements.txt
  "fastapi<0.142",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
scra = "scra.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
